<!-- Hero: the big title at the top of the home page -->
<section class="relative overflow-hidden">
  <div class="grid-bg pointer-events-none absolute inset-0"></div>

  <div class="relative mx-auto max-w-5xl px-4 pb-20 pt-12 text-center sm:px-6 sm:pt-16 lg:max-w-7xl lg:pb-24 lg:pt-36">

    <!-- Phones and tablets: a person and an AI sparkle side by side, for "humans and AI working together".
         The floating icons below take over on larger screens. -->
    <div class="mb-8 flex justify-center sm:mb-10 lg:hidden" aria-hidden="true">
      <div
        class="tile grid h-16 w-16 place-items-center rounded-2xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)] sm:h-20 sm:w-20"
        style="--r:-6deg">
        <svg class="h-8 w-8 text-slate-900 sm:h-9 sm:w-9" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round">
          <circle cx="9" cy="8" r="3.2" />
          <path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5" />
          <circle cx="17" cy="9" r="2.4" />
          <path d="M15.5 14.2c2.4-.3 4.4 1.1 5 4.3" />
        </svg>
      </div>
      <div
        class="tile -ml-3 mt-4 grid h-16 w-16 place-items-center rounded-2xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)] sm:h-20 sm:w-20"
        style="--r:6deg; animation-delay:-3s">
        <svg class="h-9 w-9 sm:h-10 sm:w-10" viewBox="0 0 24 24">
          <defs>
            <linearGradient id="g1m" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6366f1" />
              <stop offset=".5" stop-color="#3b82f6" />
              <stop offset="1" stop-color="#f97316" />
            </linearGradient>
          </defs>
          <path fill="url(#g1m)" d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3-6.3-2.2 6.3-2.2z" />
          <path fill="#f97316" d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" />
        </svg>
      </div>
    </div>

    <!-- Title and intro text, with the floating icons around them -->
    <div class="relative">
      <!-- The little floating icons around the title and intro text. Only shown on larger screens. -->
      <div class="pointer-events-none absolute inset-x-0 -bottom-6 -top-24 hidden lg:block" aria-hidden="true">
        <!-- people -->
        <div
          class="tile absolute left-[22%] top-0 grid h-20 w-20 place-items-center rounded-2xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
          style="--r:-6deg; animation-delay:-1s">
          <svg class="h-9 w-9 text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round">
            <circle cx="9" cy="8" r="3.2" />
            <path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5" />
            <circle cx="17" cy="9" r="2.4" />
            <path d="M15.5 14.2c2.4-.3 4.4 1.1 5 4.3" />
          </svg>
        </div>
        <!-- AI sparkle -->
        <div
          class="tile absolute right-[23%] top-0 grid h-20 w-20 place-items-center rounded-2xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
          style="--r:5deg; animation-delay:-3s">
          <svg class="h-10 w-10" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6366f1" />
                <stop offset=".5" stop-color="#3b82f6" />
                <stop offset="1" stop-color="#f97316" />
              </linearGradient>
            </defs>
            <path fill="url(#g1)" d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3-6.3-2.2 6.3-2.2z" />
            <path fill="#f97316" d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" />
          </svg>
        </div>
        <!-- network -->
        <div
          class="tile absolute -left-6 top-[24%] xl:left-0 grid h-24 w-24 place-items-center rounded-3xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
          style="--r:-8deg; animation-delay:-2s">
          <svg class="h-11 w-11" viewBox="0 0 24 24" fill="none" stroke-width="1.6">
            <path stroke="#cbd5e1" d="M12 5L5 17M12 5l7 12M5 17h14" />
            <circle cx="12" cy="5" r="2.6" fill="#f97316" />
            <circle cx="5" cy="17" r="2.6" fill="#3b82f6" />
            <circle cx="19" cy="17" r="2.6" fill="#0f172a" />
          </svg>
        </div>
        <!-- chat -->
        <div
          class="tile absolute -right-6 top-[24%] xl:right-0 grid h-24 w-24 place-items-center rounded-3xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
          style="--r:7deg; animation-delay:-4s">
          <svg class="h-11 w-11 text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linejoin="round">
            <path d="M3.5 6.5a2 2 0 012-2h9a2 2 0 012 2v5a2 2 0 01-2 2H9l-3.5 3v-3a2 2 0 01-2-2z" />
            <path d="M16.5 9h2a2 2 0 012 2v4.5a2 2 0 01-2 2V20l-3-2.5h-3.5a2 2 0 01-2-1.5" />
          </svg>
        </div>
        <!-- scales (fairness) -->
        <div
          class="tile absolute left-[6%] bottom-0 grid h-20 w-20 place-items-center rounded-2xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
          style="--r:4deg; animation-delay:-5s">
          <svg class="h-9 w-9 text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v16M8 20h8M5 7h14" />
            <path d="M5 7l-2.5 6a2.5 2.5 0 005 0zM19 7l-2.5 6a2.5 2.5 0 005 0z" />
          </svg>
        </div>
        <!-- tick (decision) -->
        <div
          class="tile absolute right-[6%] bottom-0 grid h-20 w-20 place-items-center rounded-2xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
          style="--r:-5deg; animation-delay:-2.5s">
          <svg class="h-9 w-9" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="#2563eb" stroke="none" />
            <path stroke="#fff" d="M8 12.5l2.7 2.7L16 9.5" />
          </svg>
        </div>
      </div>

      <h1
        class="relative mx-auto max-w-[50rem] font-display font-semibold leading-[1.02] tracking-[-0.04em] text-slate-950 lg:max-w-none">
        <!-- Title -->
        <span class="block text-5xl max-[361px]:text-[2.05rem] max-[429px]:text-[2.5rem] sm:text-7xl lg:text-8xl">Learning
          Together</span>
        <!-- Subtitle is smaller than the title; on desktop it sits on a single line -->
        <span
          class="mt-3 block max-[435px]:text-[1.5rem] text-[1.6rem] leading-[1.1] tracking-[-0.03em] text-slate-400 sm:text-4xl lg:mt-6 lg:whitespace-nowrap lg:text-[clamp(2rem,2.75vw,2.5rem)]">Designing
          Inclusive Human-AI Teams for Collective <span class="whitespace-nowrap">Decision-Making.</span></span>
      </h1>

      <p class="relative mx-auto mt-8 lg:mt-12 max-w-2xl max-[435px]:text-[1rem] text-[1.2rem] leading-relaxed text-slate-500 sm:text-2xl">
        Learning Together explores how human-AI teams can collaborate effectively, fairly, and responsibly.
      </p>
    </div>

    <!-- Universities and partners -->
    <div class="mx-auto mt-14 max-w-4xl lg:mt-24 lg:max-w-6xl">
      <div class="flex flex-wrap items-center justify-center gap-x-8 gap-y-5 sm:gap-x-10 lg:gap-x-7 xl:gap-x-10">
        <img src="assets/images/logos/sheffield2.webp" alt="University of Sheffield" class="h-10 w-auto sm:h-12"
          width="560" height="170" />
        <img src="assets/images/logos/university-cambridge-full-colour-preferred-logo-transparency-2362x491.png.webp"
          alt="University of Cambridge" class="h-9 w-auto sm:h-11" width="500" height="104" />
        <img src="assets/images/logos/hughes_hall.png" alt="Hughes Hall, Cambridge" class="h-9 w-auto sm:h-11"
          width="849" height="176" />
        <!-- Same logos as the Partners section (assets/js/partners.js) -->
        <img src="assets/images/partners/prolific.svg" alt="Prolific" class="h-9 w-auto sm:h-11" width="1180"
          height="276" />
        <img src="assets/images/partners/netmind.svg" alt="NetMind.AI" class="h-9 w-auto sm:h-11" width="124"
          height="30" />
      </div>
    </div>

    <!-- Funder logos -->
    <div class="mx-auto mt-12 max-w-xl lg:mt-16">
      <div class="flex items-center gap-4">
        <span class="h-px flex-1 bg-gradient-to-r from-transparent to-slate-200"></span>
        <p class="text-xs font-medium uppercase tracking-[0.2em] text-slate-400">Funded by</p>
        <span class="h-px flex-1 bg-gradient-to-l from-transparent to-slate-200"></span>
      </div>
      <div class="mt-5 flex flex-wrap items-center justify-center gap-x-8 gap-y-4 sm:gap-x-10">
        <!-- The AI4CI logo has extra space around it in the file, so we make it taller to look the same size as the EPSRC one -->
        <img src="assets/images/AI4CI_Lockup_Blue.svg" alt="AI4CI – AI for Collective Intelligence"
          class="-my-3 h-16 w-auto sm:h-20" width="3794" height="1640" />
        <span class="hidden h-10 w-px bg-slate-200 sm:block" aria-hidden="true"></span>
        <img src="assets/images/ukri.webp" alt="UKRI Engineering and Physical Sciences Research Council (EPSRC)"
          class="h-9 w-auto sm:h-11" width="1200" height="300" />
      </div>
    </div>
  </div>

</section>
