<!-- Hero: the big title at the top of the home page -->
<section class="relative overflow-hidden">
  <div class="grid-bg pointer-events-none absolute inset-0"></div>

  <!-- The little floating icons around the title. Only shown on larger screens. -->
  <div class="pointer-events-none absolute inset-0 mx-auto hidden max-w-7xl lg:block" aria-hidden="true">
    <!-- people -->
    <div
      class="tile absolute left-[24%] top-[3%] grid h-20 w-20 place-items-center rounded-2xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
      style="--r:-6deg; animation-delay:-1s">
      <svg class="h-9 w-9 text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round">
        <circle cx="9" cy="8" r="3.2" />
        <path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5" />
        <circle cx="17" cy="9" r="2.4" />
        <path d="M15.5 14.2c2.4-.3 4.4 1.1 5 4.3" />
      </svg>
    </div>
    <!-- AI sparkle -->
    <div
      class="tile absolute right-[25%] top-[3%] grid h-20 w-20 place-items-center rounded-2xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
      style="--r:5deg; animation-delay:-3s">
      <svg class="h-10 w-10" viewBox="0 0 24 24">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6366f1" />
            <stop offset=".5" stop-color="#3b82f6" />
            <stop offset="1" stop-color="#f97316" />
          </linearGradient>
        </defs>
        <path fill="url(#g1)" d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3-6.3-2.2 6.3-2.2z" />
        <path fill="#f97316" d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" />
      </svg>
    </div>
    <!-- network -->
    <div
      class="tile absolute left-[3%] top-[24%] grid h-24 w-24 place-items-center rounded-3xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
      style="--r:-8deg; animation-delay:-2s">
      <svg class="h-11 w-11" viewBox="0 0 24 24" fill="none" stroke-width="1.6">
        <path stroke="#cbd5e1" d="M12 5L5 17M12 5l7 12M5 17h14" />
        <circle cx="12" cy="5" r="2.6" fill="#f97316" />
        <circle cx="5" cy="17" r="2.6" fill="#3b82f6" />
        <circle cx="19" cy="17" r="2.6" fill="#0f172a" />
      </svg>
    </div>
    <!-- chat -->
    <div
      class="tile absolute right-[3%] top-[24%] grid h-24 w-24 place-items-center rounded-3xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
      style="--r:7deg; animation-delay:-4s">
      <svg class="h-11 w-11 text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linejoin="round">
        <path d="M3.5 6.5a2 2 0 012-2h9a2 2 0 012 2v5a2 2 0 01-2 2H9l-3.5 3v-3a2 2 0 01-2-2z" />
        <path d="M16.5 9h2a2 2 0 012 2v4.5a2 2 0 01-2 2V20l-3-2.5h-3.5a2 2 0 01-2-1.5" />
      </svg>
    </div>
    <!-- scales (fairness) -->
    <div
      class="tile absolute left-[16%] top-[54%] grid h-20 w-20 place-items-center rounded-2xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
      style="--r:4deg; animation-delay:-5s">
      <svg class="h-9 w-9 text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v16M8 20h8M5 7h14" />
        <path d="M5 7l-2.5 6a2.5 2.5 0 005 0zM19 7l-2.5 6a2.5 2.5 0 005 0z" />
      </svg>
    </div>
    <!-- tick (decision) -->
    <div
      class="tile absolute right-[16%] top-[54%] grid h-20 w-20 place-items-center rounded-2xl border border-slate-200 bg-white shadow-[0_10px_30px_-10px_rgba(15,23,42,0.15)]"
      style="--r:-5deg; animation-delay:-2.5s">
      <svg class="h-9 w-9" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="#2563eb" stroke="none" />
        <path stroke="#fff" d="M8 12.5l2.7 2.7L16 9.5" />
      </svg>
    </div>
  </div>

  <div class="relative mx-auto max-w-5xl px-4 pb-16 pt-20 text-center sm:px-6 sm:pt-28">

    <h1
      class="mx-auto max-w-[50rem] font-display text-[2.75rem] font-semibold leading-[1.02] tracking-[-0.04em] text-slate-950 sm:text-6xl lg:text-7xl">
      Learning Together<span class="text-slate-300">:</span>
      <span class="block text-slate-400">Designing Inclusive Human-AI Teams for Collective <span
          class="whitespace-nowrap">Decision-Making.</span></span>
    </h1>

    <p class="mx-auto mt-8 max-w-2xl text-lg leading-relaxed text-slate-500 sm:text-xl">
      Learning Together explores how human-AI teams can collaborate effectively, fairly, and responsibly.
    </p>

    <!-- Funder logos -->
    <div class="mx-auto mt-10 max-w-xl">
      <div class="flex items-center gap-4">
        <span class="h-px flex-1 bg-gradient-to-r from-transparent to-slate-200"></span>
        <p class="text-xs font-medium uppercase tracking-[0.2em] text-slate-400">Funded by</p>
        <span class="h-px flex-1 bg-gradient-to-l from-transparent to-slate-200"></span>
      </div>
      <div class="mt-5 flex flex-wrap items-center justify-center gap-x-8 gap-y-4 sm:gap-x-10">
        <!-- The AI4CI logo has extra space around it in the file, so we make it taller to look the same size as the EPSRC one -->
        <img src="assets/images/AI4CI_Lockup_Blue.svg" alt="AI4CI – AI for Collective Intelligence"
          class="-my-3 h-16 w-auto sm:h-20" width="3794" height="1640" />
        <span class="hidden h-10 w-px bg-slate-200 sm:block" aria-hidden="true"></span>
        <img src="assets/images/ukri.webp" alt="UKRI Engineering and Physical Sciences Research Council (EPSRC)"
          class="h-9 w-auto sm:h-11" width="1200" height="300" />
      </div>
    </div>

    <div class="mt-10 flex flex-col items-center gap-5">
      <!-- Main buttons, side by side and the same width (they stack on very narrow screens) -->
      <div class="flex flex-wrap justify-center gap-3">
        <a href="#about-project"
          class="inline-flex w-56 items-center justify-center gap-2 rounded-xl border border-transparent bg-brand-600 px-7 py-3.5 text-base font-semibold text-white shadow-lg shadow-brand-600/25 transition hover:bg-brand-700">
          About our project
        </a>
        <a href="publication"
          class="inline-flex w-56 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-7 py-3.5 text-base font-semibold text-slate-900 shadow-sm transition hover:border-slate-300 hover:bg-slate-50">
          Publication
          <!-- document icon -->
          <svg class="h-4 w-4 text-slate-500" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path
              d="M11.5 2.5H5.75A1.25 1.25 0 004.5 3.75v12.5a1.25 1.25 0 001.25 1.25h8.5a1.25 1.25 0 001.25-1.25V6.5z" />
            <path d="M11.5 2.5v4h4M7.5 10.5h5M7.5 13.5h5" />
          </svg>
        </a>
      </div>
      <a href="#team"
        class="group inline-flex items-center gap-1.5 text-[15px] font-medium text-slate-600 hover:text-slate-950">
        Meet our team
        <!-- down arrow: this link scrolls down to the Team section -->
        <svg class="h-4 w-4 transition group-hover:translate-y-0.5" viewBox="0 0 20 20" fill="currentColor"
          aria-hidden="true">
          <path
            d="M10 3a1 1 0 011 1v9.6l3.3-3.3a1 1 0 111.4 1.4l-5 5a1 1 0 01-1.4 0l-5-5a1 1 0 111.4-1.4L9 13.6V4a1 1 0 011-1z" />
        </svg>
      </a>
    </div>
  </div>

</section>
